name: Watch aws-azure-login upstream

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork (bot state only)
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Check upstream repo for new commits
        id: check
        run: |
          UPSTREAM_REPO="aws-azure-login/aws-azure-login"
          API_URL="https://api.github.com/repos/$UPSTREAM_REPO/commits"

          LATEST_SHA=$(curl -s $API_URL | jq -r '.[0].sha')
          LATEST_MSG=$(curl -s $API_URL | jq -r '.[0].commit.message')

          if [ ! -f last_sha.txt ]; then
            echo $LATEST_SHA > last_sha.txt
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_SHA=$(cat last_sha.txt)

          if [ "$LATEST_SHA" != "$LAST_SHA" ]; then
            echo $LATEST_SHA > last_sha.txt
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "sha=$LATEST_SHA" >> $GITHUB_OUTPUT
            echo "msg<<EOF" >> $GITHUB_OUTPUT
            echo "$LATEST_MSG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit bot state only
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "Watcher Bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_sha.txt
          git commit -m "Watcher: update last seen upstream commit"
          git push

      - name: Notify via GitHub Issue
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Upstream aws-azure-login updates";

            const body = `
🚨 **New upstream change detected**

🔗 https://github.com/aws-azure-login/aws-azure-login/commit/${process.env.SHA}

**Commit message**
\`\`\`
${process.env.MSG}
\`\`\`
`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });

            const issue = issues.find(i => i.title === title);

            if (!issue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            }
        env:
          SHA: ${{ steps.check.outputs.sha }}
          MSG: ${{ steps.check.outputs.msg }}
